# Example Fly.io deployment (ApiSpec §16 — managed PaaS, stateless container).
# This is a STARTER template: set your real app name + region, provision a
# managed Postgres (and Redis later), and load secrets via `fly secrets set`.
# A Render alternative (render.yaml) is described in the README.

app = "doit-api"           # <-- change to your Fly app name
primary_region = "iad"     # <-- pick a region near your users

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  HOST = "0.0.0.0"
  APPLE_STUB_VERIFICATION = "false"   # never stub in prod

# Run pending migrations before the new release takes traffic (ApiSpec §13, §16).
[deploy]
  release_command = "node --import ./loader.mjs node_modules/drizzle-kit/bin.cjs migrate"
  strategy = "rolling"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    method = "GET"
    path = "/ready"
    interval = "15s"
    timeout = "3s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

# Secrets are NOT stored here. Set them out-of-band, e.g.:
#   fly secrets set DATABASE_URL=... JWT_PRIVATE_KEY=... JWT_PUBLIC_KEY=... \
#     APPLE_BUNDLE_ID=... ANTHROPIC_API_KEY=... (and REDIS_URL / APNS_* later)
